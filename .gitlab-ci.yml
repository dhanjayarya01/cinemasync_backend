image: node:18

stages:
  - test
  - build
  - deploy

hello_ci:
  stage: test
  script:
    - echo "CI is working"
    - node -v
    - npm -v

build_backend:
  stage: build
  script:
    - echo "Building backend..."
    - npm install
    - echo "Backend build completed"
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  only:
    - main

deploy_backend:
  stage: deploy
  script:
    - echo "Deploying backend..."
