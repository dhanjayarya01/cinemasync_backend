image: docker:25

services:
  - docker:25-dind

variables:
  DOCKER_TLS_CERTDIR: ""

stages:
  - test
  - build
  - deploy

#testing for code and syntax errors
test_backend:
  stage: test
  only:
    - main
  script:
    - echo "🧪 Running full backend test"

    - |
      docker run --rm \
        -v "$PWD":/app \
        -w /app \
        -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
        -e GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
        -e MONGODB_URI="$MONGODB_URI" \
        -e JWT_SECRET="$JWT_SECRET" \
        -e PORT="$PORT" \
        -e FRONTEND_URL="$FRONTEND_URL" \
        node:18-alpine sh -c "
          echo '📦 Installing dependencies' &&
          npm install &&

          echo '🚀 Starting server' &&
          node src/index.js > server.log 2>&1 &

          echo '⏳ Waiting for server startup' &&
          sleep 10 &&

          echo '📄 Server logs:' &&
          cat server.log &&

          echo '🔍 Checking server startup' &&
          grep -q 'Server running on port 4000' server.log &&

          echo '🔍 Checking MongoDB connection' &&
          grep -qi 'MongoDB Connected' server.log &&

          echo '🌐 Testing /health endpoint' &&
          apk add --no-cache curl &&
          curl -f http://localhost:4000/health &&

          echo '✅ BACKEND TEST PASSED'
        "



#build 
build_image:
  stage: build
  only:
    - main
  script:
    - echo "🔐 Logging into Docker Hub"
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"

    - echo "🐳 Building Docker image"
    - docker build -t dhanjayarya/cinemasync-backend:0.3 .

    - echo "🚀 Pushing images to Docker Hub"
    - docker push dhanjayarya/cinemasync-backend:0.3 .


deploy_backend:
  stage: deploy
  only:
    - main
  script:
    - echo " Setting up SSH"

    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

    - echo "Deploying to Ubuntu"
    - |
      ssh -i ~/.ssh/id_ed25519 $SERVER_USER@$SERVER_IP "
        docker pull dhanjayarya/cinemasync-backend:latest &&
        docker stop cinemasync || true &&
        docker rm cinemasync || true &&
        docker run -d \
          --name cinemasync \
          -p 3000:4000 \
          --env-file ~/cinemasync.env \
          dhanjayarya/cinemasync-backend:latest
      "
