image: docker:25

services:
  - docker:25-dind

variables:
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - deploy

#build 
build_image:
  stage: build
  only:
    - main
  script:
    - echo "🔐 Logging into Docker Hub"
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"

    - echo "🐳 Building Docker image"
    - docker build -t dhanjayarya/cinemasync-backend:latest .
    - docker build -t dhanjayarya/cinemasync-backend:0.2 .

    - echo "🚀 Pushing images to Docker Hub"
    - docker push dhanjayarya/cinemasync-backend:latest
    - docker push dhanjayarya/cinemasync-backend:0.2


deploy_backend:
  stage: deploy
  only:
    - main
  script:
    - echo " Setting up SSH"

    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

    - echo "Deploying to Ubuntu"
    - |
      ssh -i ~/.ssh/id_ed25519 $SERVER_USER@$SERVER_IP "
        docker pull dhanjayarya/cinemasync-backend:latest &&
        docker stop cinemasync || true &&
        docker rm cinemasync || true &&
        docker run -d \
          --name cinemasync \
          -p 3000:4000 \
          --env-file ~/cinemasync.env \
          dhanjayarya/cinemasync-backend:latest
      "
