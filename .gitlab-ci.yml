image: node:18

stages:
  - test
  - verifyvar
  - build
  - deploy

before_script:
  - apt-get update -y
  - apt-get install -y openssh-client

# -------------------------------
# 1️⃣ BASIC TEST STAGE
# -------------------------------
hello_ci:
  stage: test
  script:
    - echo "CI is working"
    - node -v
    - npm -v

# -------------------------------
# 2️⃣ VERIFY SSH VARIABLE STAGE
# -------------------------------
verify_ssh_var:
  stage: verifyvar
  only:
    - main
  script:
    - echo "🔍 Verifying SSH_PRIVATE_KEY variable..."

    # Check variable exists
    - |
      if [ -z "$SSH_PRIVATE_KEY" ]; then
        echo "❌ SSH_PRIVATE_KEY is EMPTY or NOT SET"
        exit 1
      else
        echo "✅ SSH_PRIVATE_KEY is SET"
      fi

    # Print variable length (SAFE)
    - |
      KEY_LEN=$(printf "%s" "$SSH_PRIVATE_KEY" | wc -c)
      echo "🔢 SSH_PRIVATE_KEY length: $KEY_LEN"

    # Write key to file
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

    # Show file info (SAFE)
    - ls -l ~/.ssh

    # Check first line of key (SAFE)
    - echo "📄 First line of SSH key:"
    - head -n 1 ~/.ssh/id_ed25519

    # Validate SSH key format
    - ssh-keygen -l -f ~/.ssh/id_ed25519 || (echo "❌ Invalid SSH key format" && exit 1)

    - echo "✅ SSH key format looks valid"

# -------------------------------
# 3️⃣ BUILD STAGE
# -------------------------------
build_backend:
  stage: build
  only:
    - main
  script:
    - echo "Building backend..."
    - npm install
    - echo "Backend build completed"
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# -------------------------------
# 4️⃣ DEPLOY STAGE
# -------------------------------
deploy_backend:
  stage: deploy
  only:
    - main
  script:
    - echo "🚀 Deploying backend..."

    # SSH setup (key already verified)
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H 64.227.180.201 >> ~/.ssh/known_hosts

    # Deploy commands
    - ssh -i ~/.ssh/id_ed25519 dhanjay-laptop@64.227.180.201 "
        cd /home/cinemasync_backend/cinemasync_backend &&
        git pull origin main &&
        npm install --production &&
        pm2 reload cinemasync || pm2 start src/index.js --name cinemasync
      "
